<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2321; --ink-soft:#5c6662; --ink-faint:#98a29d;
  --paper:#f6f8f6; --card:#ffffff; --line:#e3e8e4;
  --green:#1e7f5c; --green-soft:#e2f2ea; --green-deep:#0d4a35;
  --red:#c2402f; --red-soft:#fbe9e5; --red-deep:#7a2417;
  --amber:#b97a12; --amber-soft:#faf0dc;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}

header{padding:22px 20px 14px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.5px}
.date{font-size:13px;color:var(--ink-soft);margin-top:2px}
.people{display:flex;gap:6px;background:#eceeec;border-radius:999px;padding:4px}
.person{border:0;background:transparent;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--ink-soft);padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .15s}
.person.active{background:var(--ink);color:#fff}

.stats{display:flex;gap:10px;padding:0 20px 6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat .l{font-size:11px;color:var(--ink-faint);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;margin-top:2px}

main{flex:1;padding:14px 20px 90px}
.section-title{font-size:12px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}

.habit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:border-color .2s, background .2s}
.habit.done{background:var(--green-soft);border-color:#bfe0d0}
.habit.failed{background:var(--red-soft);border-color:#efc7bd}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.h-name{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
.habit.done .h-name{color:var(--green-deep)}
.habit.failed .h-name{color:var(--red-deep)}
.h-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.streak{color:var(--amber);font-weight:600}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;cursor:pointer;user-select:none}
.badge.done{background:var(--green);color:#fff}
.badge.failed{background:var(--red);color:#fff}
.h-actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.b-done:hover{background:var(--green);border-color:var(--green);color:#fff}
.btn.b-fail:hover{background:var(--red);border-color:var(--red);color:#fff}
.note-row{margin-top:10px}
.note-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:13px;background:#fff;color:var(--ink)}
.note-input:focus{outline:none;border-color:var(--green)}
.note-view{margin-top:9px;font-size:12.5px;color:var(--ink-soft);background:rgba(255,255,255,.6);border-radius:8px;padding:7px 10px}
.undo{background:none;border:none;font-size:11.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif}
.empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:40px 0}

.days{display:flex;gap:5px;margin-top:8px}
.day-dot{width:24px;height:24px;border-radius:8px;background:#eef1ee;color:var(--ink-faint);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.day-dot.on{background:var(--ink);color:#fff}

.bar-row{margin-bottom:12px}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-track{height:7px;border-radius:999px;background:#e8ece9;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--green);transition:width .4s}
.bar-fill.low{background:var(--red)}
.compare{display:flex;gap:10px;margin-top:4px}
.comp-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.comp-card .n{font-size:13px;font-weight:600}
.comp-card .p{font-family:'Sora',sans-serif;font-size:24px;font-weight:700;margin:2px 0}
.comp-card .s{font-size:12px;color:var(--ink-soft)}
.comp-card.leader{border-color:var(--green);border-width:2px}
.review{background:var(--green-deep);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.review .t{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;opacity:.85}
.review .m{font-size:13.5px;margin-top:4px;line-height:1.5}

.fab{position:fixed;bottom:84px;right:calc(50% - 200px);width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:20}
@media(max-width:460px){.fab{right:18px}}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:440px;margin:0 auto;z-index:10}
.tab{flex:1;border:0;background:transparent;padding:11px 0 13px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--ink-faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.active{color:var(--green-deep)}
.tab svg{width:21px;height:21px}

.modal-bg{position:fixed;inset:0;background:rgba(20,25,22,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:22px 20px 30px;width:100%;max-width:440px}
.modal h2{font-family:'Sora',sans-serif;font-size:17px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px}
.field input:focus{outline:none;border-color:var(--green)}
.day-pick{display:flex;gap:6px}
.day-pick button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 0;font-size:12px;font-weight:600;color:var(--ink-faint);cursor:pointer;font-family:'Inter',sans-serif}
.day-pick button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.save-btn{width:100%;border:0;background:var(--green);color:#fff;border-radius:12px;padding:13px 0;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.hidden{display:none}
@keyframes slideL{from{opacity:.4;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideR{from{opacity:.4;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
main{overflow-x:hidden}
.evo{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.evo.up{background:var(--green-soft);color:var(--green-deep)}
.evo.down{background:var(--red-soft);color:var(--red-deep)}
.evo-box{margin-top:10px;background:var(--green-soft);border:1px solid #bfe0d0;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:5px}
.evo-line{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--green-deep)}
.change-log{margin-top:8px;font-size:11.5px;color:var(--ink-faint);line-height:1.7}
.evo-hero{background:var(--green-deep);border-radius:var(--radius);padding:6px 16px;margin-bottom:6px}
.evo-hero-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.evo-hero-row:last-child{border-bottom:0}
.evo-hero-name{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:#fff}
.evo-hero-detail{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.evo-hero .evo.up{background:rgba(255,255,255,.15);color:#9fe8c4}
.evo-hero .evo.down{background:rgba(255,255,255,.15);color:#ffb3a3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hist-summary{font-size:12.5px;color:var(--ink-soft);margin:2px 0 4px}
.icon-btn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="head-row">
    <div>
      <h1>Habit Tracker</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="people" id="peopleToggle"></div>
  </div>
</header>

<div class="stats" id="statsRow"></div>

<main>
  <div id="viewToday"></div>
  <div id="viewHabits" class="hidden"></div>
  <div id="viewHistory" class="hidden"></div>
  <div id="viewMetrics" class="hidden"></div>
</main>

<button class="fab" id="fabAdd" title="Add habit">+</button>

<nav>
  <button class="tab active" data-tab="today">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16M9 16l2 2 4-4"/></svg>
    Today
  </button>
  <button class="tab" data-tab="habits">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
    Habits
  </button>
  <button class="tab" data-tab="history">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    History
  </button>
  <button class="tab" data-tab="metrics">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Metrics
  </button>
</nav>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">New habit</h2>
    <div class="field"><label>Habit name</label><input id="fName" placeholder="Read a book"></div>
    <div class="field"><label>Current goal</label><input id="fGoal" placeholder="10 min a day"></div>
    <div class="field"><label>Days of the week</label>
      <div class="day-pick" id="fDays"></div>
    </div>
    <button class="save-btn" id="fSave">Add habit</button>
  </div>
</div>

</div>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const today = new Date();
const todayDow = today.getDay();
document.getElementById('dateLabel').textContent =
  today.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});

// ---------- state (in-memory demo; Supabase replaces this later) ----------
const state = {
  people: [{id:'p1',name:'Jos'},{id:'p2',name:'San'}],
  current: 'p1',
  tab: 'today',
  habits: [],
  // entries[habitId] = { '2026-07-13': {status:'done',note:''} , ... }
  entries: {},
  histPeriod: 'week',
  histFilter: 'all'
};

// ---------- persistence (Cloudflare KV via /api/data) ----------
let persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({habits:state.habits, entries:state.entries})
    }).catch(()=>{});
  }, 400);
}
let loaded = false;

// Local-timezone date key (Jos = Brazil, San = Indonesia — each device uses its own local day)
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const todayKey = dateKey(today);
const $ = s => document.querySelector(s);

function entriesFor(h){ return state.entries[h.id] || (state.entries[h.id]={}); }
function todayEntry(h){ return entriesFor(h)[todayKey]; }
function setEntry(h,status){
  if(status===null){ delete entriesFor(h)[todayKey]; }
  else {
    const prev = todayEntry(h) || {};
    entriesFor(h)[todayKey] = {status, note: prev.note||''};
  }
  render();
}
function setNote(h,note){
  const e = todayEntry(h) || {status:null,note:''};
  e.note = note; entriesFor(h)[todayKey]=e;
}

function streak(h){
  let s=0;
  const t = todayEntry(h);
  if (t && t.status==='done') s++;
  for(let i=1;i<365;i++){
    const d = new Date(); d.setDate(today.getDate()-i);
    if(!h.days.includes(d.getDay())) continue;
    const e = entriesFor(h)[dateKey(d)];
    if(e && e.status==='done') s++;
    else break;
  }
  return s;
}
function completion(h){
  let done=0,total=0;
  for(const e of Object.values(entriesFor(h))){
    total++; if(e.status==='done') done++;
  }
  return total? Math.round(done/total*100) : 0;
}
function personHabits(pid){ return state.habits.filter(h=>h.owner===pid); }

// ---------- evolution tracking ----------
function parseNum(goal){ const m = String(goal).match(/(\d+(?:[.,]\d+)?)/); return m? parseFloat(m[1].replace(',','.')) : null; }
function evolution(h){
  const out = {};
  const a = parseNum(h.initial?.goal), b = parseNum(h.goal);
  if(a!==null && b!==null && a!==b) out.goal = {from:h.initial.goal, to:h.goal, pct: Math.round((b-a)/a*100)};
  else if(h.initial && h.initial.goal!==h.goal) out.goal = {from:h.initial.goal, to:h.goal, pct:null};
  const d0 = h.initial?.daysCount, d1 = h.days.length;
  if(d0 && d0!==d1) out.days = {from:d0, to:d1, pct: Math.round((d1-d0)/d0*100)};
  return out;
}
function pctBadge(pct){
  if(pct===null || pct===undefined) return '';
  const up = pct>0;
  return `<span class="evo ${up?'up':'down'}">${up?'▲':'▼'} ${up?'+':''}${pct}%</span>`;
}

// migrate old data + apply auto-fail to past unmarked scheduled days
function migrateAndAutofail(){
  for(const h of state.habits){
    if(!h.createdAt) h.createdAt = todayKey;
    if(!h.initial) h.initial = {goal:h.goal, daysCount:h.days.length};
    if(!h.changes) h.changes = [];
    // drop legacy 'skipped' entries
    for(const [k,e] of Object.entries(entriesFor(h))) if(e.status==='skipped') delete state.entries[h.id][k];
    // auto-fail: every scheduled day since creation, before today, with no entry
    const start = new Date(h.createdAt+'T12:00:00');
    const d = new Date(start);
    for(let guard=0; guard<400 && dateKey(d)<todayKey; guard++, d.setDate(d.getDate()+1)){
      const k = dateKey(d);
      if(!h.days.includes(d.getDay())) continue;
      if(!entriesFor(h)[k]) state.entries[h.id][k] = {status:'failed', note:'', auto:true};
    }
  }
}

// ---------- render ----------
function render(){
  persist();
  renderPeople(); renderStats(); renderToday(); renderHabits(); renderHistory(); renderMetrics();
  $('#viewToday').classList.toggle('hidden', state.tab!=='today');
  $('#viewHabits').classList.toggle('hidden', state.tab!=='habits');
  $('#viewHistory').classList.toggle('hidden', state.tab!=='history');
  $('#viewMetrics').classList.toggle('hidden', state.tab!=='metrics');
  $('#fabAdd').style.display = state.tab==='habits' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
}

function renderPeople(){
  $('#peopleToggle').innerHTML = state.people.map(p=>
    `<button class="person ${p.id===state.current?'active':''}" onclick="switchPerson('${p.id}')">${p.name}</button>`).join('');
}
window.switchPerson = id => { state.current=id; render(); };

function renderStats(){
  const hs = personHabits(state.current).filter(h=>h.days.includes(todayDow));
  const done = hs.filter(h=>todayEntry(h)?.status==='done').length;
  const best = Math.max(0,...personHabits(state.current).map(streak));
  const all = personHabits(state.current);
  const avg = all.length? Math.round(all.reduce((a,h)=>a+completion(h),0)/all.length) : 0;
  $('#statsRow').innerHTML = `
    <div class="stat"><div class="l">Today</div><div class="v">${done} / ${hs.length}</div></div>
    <div class="stat"><div class="l">Top streak</div><div class="v">${best} days</div></div>
    <div class="stat"><div class="l">Overall</div><div class="v">${avg}%</div></div>`;
}

function renderToday(){
  const hs = personHabits(state.current).filter(h=>h.days.includes(todayDow));
  if(!hs.length){ $('#viewToday').innerHTML = `<div class="empty">No habits scheduled for today.</div>`; return; }
  $('#viewToday').innerHTML = `<div class="section-title">Today's habits</div>` + hs.map(h=>{
    const e = todayEntry(h);
    const st = e?.status;
    const sk = streak(h);
    const evo = evolution(h);
    const meta = `<div class="h-meta">${h.goal}${evo.goal?` ${pctBadge(evo.goal.pct)}`:''}${sk?` · <span class="streak">🔥 ${sk}-day streak</span>`:''}</div>`;
    if(st){
      const label = st[0].toUpperCase()+st.slice(1);
      return `<div class="habit ${st}">
        <div class="h-top"><div><div class="h-name">${h.name}</div>${meta}</div>
        <span class="badge ${st}">${label}</span></div>
        ${e.note?`<div class="note-view">📝 ${e.note}</div>`:''}
        <button class="undo" onclick="undo('${h.id}')">Undo</button>
      </div>`;
    }
    return `<div class="habit">
      <div class="h-top"><div><div class="h-name">${h.name}</div>${meta}</div></div>
      <div class="h-actions">
        <button class="btn b-done" onclick="mark('${h.id}','done')">✓ Done</button>
        <button class="btn b-fail" onclick="mark('${h.id}','failed')">✕ Failed</button>
      </div>
      <div class="note-row"><input class="note-input" placeholder="Add a note about today..."
        value="${e?.note||''}" onchange="noteChange('${h.id}',this.value)"></div>
    </div>`;
  }).join('');
}
window.mark = (id,st)=>{ const h=state.habits.find(x=>x.id===id); setEntry(h,st); };
window.undo = id =>{ const h=state.habits.find(x=>x.id===id); setEntry(h,null); };
window.noteChange = (id,v)=>{ const h=state.habits.find(x=>x.id===id); setNote(h,v); render(); };

function renderHabits(){
  const hs = personHabits(state.current);
  $('#viewHabits').innerHTML = `<div class="section-title">All habits — ${state.people.find(p=>p.id===state.current).name}</div>` +
    (hs.length? hs.map(h=>{
      const evo = evolution(h);
      const evoHtml = (evo.goal||evo.days)? `
        <div class="evo-box">
          ${evo.goal?`<div class="evo-line"><span>Goal: <b>${evo.goal.from}</b> → <b>${evo.goal.to}</b></span>${pctBadge(evo.goal.pct)}</div>`:''}
          ${evo.days?`<div class="evo-line"><span>Days/week: <b>${evo.days.from}</b> → <b>${evo.days.to}</b></span>${pctBadge(evo.days.pct)}</div>`:''}
        </div>` : '';
      const log = (h.changes&&h.changes.length)? `<div class="change-log">${h.changes.slice(-4).reverse().map(c=>
        `<div>${new Date(c.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} — ${c.field==='goal'?'goal':'days/week'}: ${c.from} → ${c.to}</div>`).join('')}</div>` : '';
      return `
    <div class="habit">
      <div class="h-top"><div><div class="h-name">${h.name}</div>
      <div class="h-meta">${h.goal} · ${completion(h)}% completion · since ${new Date(h.createdAt+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" title="Edit" onclick="editHabit('${h.id}')">✎</button>
        <button class="icon-btn danger" title="Delete" onclick="deleteHabit('${h.id}')">🗑</button>
      </div></div>
      ${evoHtml}${log}
      <div class="days">${DAYS.map((d,i)=>`<div class="day-dot ${h.days.includes(i)?'on':''}">${d[0]}</div>`).join('')}</div>
    </div>`;}).join('') : `<div class="empty">No habits yet. Tap + to add one.</div>`);
}

const STATUS_LABEL = {done:'Done', failed:'Failed'};
function renderHistory(){
  const days = state.histPeriod==='day'?1 : state.histPeriod==='week'?7 : 30;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-(days-1)); cutoff.setHours(0,0,0,0);
  const hs = personHabits(state.current);
  const byDate = {};
  for(const h of hs){
    for(const [k,e] of Object.entries(entriesFor(h))){
      const d = new Date(k+'T12:00:00');
      if(d < cutoff || d > today) continue;
      if(state.histFilter!=='all' && e.status!==state.histFilter) continue;
      (byDate[k] = byDate[k]||[]).push({habit:h, entry:e});
    }
  }
  const dates = Object.keys(byDate).sort().reverse();
  const chip = (id,label,active,fn)=>`<button class="chip ${active?'on':''}" onclick="${fn}('${id}')">${label}</button>`;
  const periodChips = ['day','week','month'].map(p=>chip(p, p==='day'?'Today':p==='week'?'Last 7 days':'Last 30 days', state.histPeriod===p,'histPeriod')).join('');
  const filterChips = ['all','done','failed'].map(f=>chip(f, f==='all'?'All':STATUS_LABEL[f], state.histFilter===f,'histFilter')).join('');
  const counts = {done:0,failed:0};
  dates.forEach(k=>byDate[k].forEach(x=>counts[x.entry.status]!==undefined && counts[x.entry.status]++));
  const body = dates.length ? dates.map(k=>{
    const d = new Date(k+'T12:00:00');
    const label = k===todayKey ? 'Today' : d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
    return `<div class="section-title">${label}</div>` + byDate[k].map(({habit,entry})=>`
      <div class="habit ${entry.status}" style="padding:11px 14px">
        <div class="h-top"><div><div class="h-name" style="font-size:14px">${habit.name}</div>
        <div class="h-meta">${habit.goal}${entry.auto?' · not marked (auto)':''}</div></div>
        <span class="badge ${entry.status}">${STATUS_LABEL[entry.status]||entry.status}</span></div>
        ${entry.note?`<div class="note-view">📝 ${entry.note}</div>`:''}
      </div>`).join('');
  }).join('') : `<div class="empty">Nothing recorded in this period${state.histFilter!=='all'?' with this filter':''}.</div>`;
  $('#viewHistory').innerHTML = `
    <div class="chips">${periodChips}</div>
    <div class="chips">${filterChips}</div>
    <div class="hist-summary">✓ ${counts.done} done · ✕ ${counts.failed} failed</div>
    ${body}`;
}
window.histPeriod = p =>{ state.histPeriod=p; render(); };
window.histFilter = f =>{ state.histFilter=f; render(); };

function renderMetrics(){
  const me = state.people.find(p=>p.id===state.current);
  const hs = personHabits(state.current);
  const bars = hs.map(h=>{
    const c = completion(h);
    return `<div class="bar-row"><div class="bar-head"><span>${h.name}</span><span style="color:var(--ink-soft)">${c}%</span></div>
      <div class="bar-track"><div class="bar-fill ${c<65?'low':''}" style="width:${c}%"></div></div></div>`;
  }).join('');
  const comps = state.people.map(p=>{
    const ph = personHabits(p.id);
    const avg = ph.length? Math.round(ph.reduce((a,h)=>a+completion(h),0)/ph.length):0;
    const best = Math.max(0,...ph.map(streak));
    return {p,avg,best};
  });
  const lead = comps.reduce((a,b)=>b.avg>a.avg?b:a);
  const compHtml = comps.map(c=>`
    <div class="comp-card ${c===lead?'leader':''}">
      <div class="n">${c.p.name}${c===lead?' 🏆':''}</div>
      <div class="p">${c.avg}%</div>
      <div class="s">🔥 best streak: ${c.best} days</div>
    </div>`).join('');
  const top = hs.slice().sort((a,b)=>completion(b)-completion(a))[0];
  const evoRows = hs.map(h=>({h, e:evolution(h)})).filter(x=>x.e.goal||x.e.days);
  const evoSection = evoRows.length? `
    <div class="section-title">📈 Your evolution</div>
    <div class="evo-hero">${evoRows.map(({h,e})=>`
      <div class="evo-hero-row">
        <div><div class="evo-hero-name">${h.name}</div>
        <div class="evo-hero-detail">${e.goal?`${e.goal.from} → <b>${e.goal.to}</b>`:''}${e.goal&&e.days?' · ':''}${e.days?`${e.days.from} → <b>${e.days.to}</b> days/wk`:''}</div></div>
        <div style="display:flex;gap:5px">${e.goal?pctBadge(e.goal.pct):''}${e.days?pctBadge(e.days.pct):''}</div>
      </div>`).join('')}</div>` : '';
  $('#viewMetrics').innerHTML = `
    ${evoSection}
    <div class="section-title">Per habit — ${me.name}</div>${bars || '<div class="empty">No data yet.</div>'}
    <div class="section-title">Head to head</div>
    <div class="compare">${compHtml}</div>
    ${top?`<div class="review"><div class="t">✨ Weekly review</div>
      <div class="m">${top.name} is at ${completion(top)}%. ${completion(top)>=85?'Consistent! Consider raising the goal beyond "'+top.goal+'".':'Keep pushing — consistency beats intensity.'}</div></div>`:''}`;
}

// ---------- tabs ----------
const TAB_ORDER = ['today','habits','history','metrics'];
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ state.tab=t.dataset.tab; render(); });

// ---------- swipe left/right to change tabs (mobile only) ----------
(function(){
  if(!window.matchMedia('(pointer:coarse)').matches) return; // touch devices only
  const area = document.querySelector('main');
  let x0=null, y0=null, active=false;
  area.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; active=true;
  }, {passive:true});
  area.addEventListener('touchend', e=>{
    if(!active || x0===null) return; active=false;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0=null; y0=null;
    // horizontal, long enough, and clearly not a vertical scroll
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.8) return;
    const i = TAB_ORDER.indexOf(state.tab);
    const ni = dx < 0 ? i+1 : i-1;
    if(ni < 0 || ni >= TAB_ORDER.length) return;
    state.tab = TAB_ORDER[ni];
    render();
    // subtle slide-in feedback
    const view = $('#view'+state.tab.charAt(0).toUpperCase()+state.tab.slice(1));
    if(view){
      view.style.animation='none'; void view.offsetWidth;
      view.style.animation = (dx<0?'slideL':'slideR')+' .22s ease';
    }
  }, {passive:true});
})();

// ---------- add / edit habit modal ----------
let pickedDays = new Set([1,2,3,4,5]);
let editingId = null;
function renderDayPick(){
  $('#fDays').innerHTML = DAYS.map((d,i)=>
    `<button class="${pickedDays.has(i)?'on':''}" onclick="toggleDay(${i})">${d}</button>`).join('');
}
window.toggleDay = i =>{ pickedDays.has(i)?pickedDays.delete(i):pickedDays.add(i); renderDayPick(); };
function openModal(){
  $('#modalTitle').textContent = editingId ? 'Edit habit' : 'New habit';
  $('#fSave').textContent = editingId ? 'Save changes' : 'Add habit';
  renderDayPick(); $('#modalBg').classList.add('open');
}
$('#fabAdd').onclick = ()=>{
  editingId = null; pickedDays = new Set([1,2,3,4,5]);
  $('#fName').value=''; $('#fGoal').value='';
  openModal();
};
window.editHabit = id =>{
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  editingId = id; pickedDays = new Set(h.days);
  $('#fName').value = h.name; $('#fGoal').value = h.goal;
  openModal();
};
window.deleteHabit = id =>{
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  if(!confirm(`Delete "${h.name}" and all its history?`)) return;
  state.habits = state.habits.filter(x=>x.id!==id);
  delete state.entries[id];
  render();
};
$('#modalBg').onclick = e =>{ if(e.target.id==='modalBg') $('#modalBg').classList.remove('open'); };
$('#fSave').onclick = ()=>{
  const name = $('#fName').value.trim(), goal = $('#fGoal').value.trim();
  if(!name) return;
  if(editingId){
    const h = state.habits.find(x=>x.id===editingId);
    const newGoal = goal||'Daily';
    if(h.goal !== newGoal) h.changes.push({date:todayKey, field:'goal', from:h.goal, to:newGoal});
    if(h.days.length !== pickedDays.size) h.changes.push({date:todayKey, field:'days', from:h.days.length, to:pickedDays.size});
    h.name = name; h.goal = newGoal; h.days = [...pickedDays];
  } else {
    state.habits.push({id:'h'+Date.now(), owner:state.current, name, goal:goal||'Daily', days:[...pickedDays],
      createdAt: todayKey, initial:{goal:goal||'Daily', daysCount:pickedDays.size}, changes:[]});
  }
  editingId = null;
  $('#modalBg').classList.remove('open');
  state.tab='habits'; render();
};

async function loadRemote(){
  try{
    const res = await fetch('/api/data');
    const saved = await res.json();
    if(saved && saved.habits){ state.habits = saved.habits; state.entries = saved.entries || {}; return true; }
  }catch(e){}
  return false;
}
async function init(){
  loaded = await loadRemote();
  migrateAndAutofail();
  render();
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible'){
    if(await loadRemote()){ migrateAndAutofail(); render(); }
  }
});
init();
</script>
